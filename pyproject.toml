[project]
name = "odoo-mcp"
version = "0.1.0"
description = "MCP server that connects Claude to an Odoo 19 database"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2"]

[project.scripts]
odoo-mcp = "odoo_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["odoo_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
